<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AktivOslo — Finn aktiviteter nær deg</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f0;color:#1a1a1a;min-height:100vh}
header{background:#1a1a2e;color:#fff;padding:16px 20px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.3)}
header h1{font-size:1.4rem;font-weight:700;letter-spacing:-.5px}
header p{font-size:.8rem;opacity:.6;margin-top:2px}
.search-bar{padding:12px 16px;background:#fff;border-bottom:1px solid #e8e8e0}
.search-bar input{width:100%;padding:10px 14px;border:1.5px solid #ddd;border-radius:10px;font-size:.95rem;outline:none}
.search-bar input:focus{border-color:#1a1a2e}
.filters{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid #e8e8e0;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filter-btn{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1.5px solid #ddd;background:#fff;font-size:.82rem;cursor:pointer;transition:all .2s;font-weight:500}
.filter-btn.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.sub-filters{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;background:#fafaf8;border-bottom:1px solid #e8e8e0;scrollbar-width:none}
.sub-filters::-webkit-scrollbar{display:none}
.sub-btn{white-space:nowrap;padding:5px 12px;border-radius:16px;border:1px solid #ddd;background:#fff;font-size:.78rem;cursor:pointer;transition:all .2s}
.sub-btn.active{background:#4a90d9;color:#fff;border-color:#4a90d9}
.results-info{padding:10px 16px;font-size:.8rem;color:#666;background:#fafaf8;border-bottom:1px solid #e8e8e0}
.cards{padding:12px 16px;display:grid;gap:12px}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:transform .15s,box-shadow .15s;border:1px solid #eee}
.card:active{transform:scale(.98)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card-name{font-size:1rem;font-weight:600;line-height:1.3}
.badge-free{background:#e8f5e9;color:#2e7d32;font-size:.72rem;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.badge-paid{background:#fff3e0;color:#e65100;font-size:.72rem;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.card-area{font-size:.78rem;color:#888;margin-top:3px}
.card-desc{font-size:.84rem;color:#555;margin-top:8px;line-height:1.5}
.card-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tag{background:#f0f0eb;color:#555;font-size:.73rem;padding:3px 9px;border-radius:8px}
.tag.type{background:#e8eef7;color:#1a3a6e}
.card-footer{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.icon-info{font-size:.75rem;color:#888;display:flex;align-items:center;gap:3px}
.featured-badge{background:#fff9c4;color:#795548;font-size:.7rem;padding:2px 7px;border-radius:8px;font-weight:600}
.no-results{text-align:center;padding:60px 20px;color:#999}
.no-results span{font-size:2.5rem;display:block;margin-bottom:12px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;overflow-y:auto}
.modal{background:#fff;margin:20px;border-radius:18px;padding:24px;max-width:600px;margin-left:auto;margin-right:auto}
.modal h2{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.modal .m-area{color:#888;font-size:.85rem;margin-bottom:12px}
.modal .m-desc{font-size:.9rem;line-height:1.6;margin-bottom:16px;color:#333}
.modal-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:.85rem}
.modal-row:last-child{border-bottom:none}
.m-label{color:#888;width:120px;flex-shrink:0}
.m-val{color:#1a1a1a;font-weight:500}
.close-btn{float:right;font-size:1.5rem;cursor:pointer;color:#999;line-height:1}
.modal-tags{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0}
.btn-book{display:block;background:#1a1a2e;color:#fff;text-align:center;padding:13px;border-radius:12px;text-decoration:none;font-weight:600;margin-top:16px;font-size:.95rem}
</style>
</head>
<body>

<header>
  <h1>🏃 AktivOslo</h1>
  <p>Finn aktivitetssteder i Oslo, Asker og Bærum</p>
</header>

<div class="search-bar">
  <input type="text" id="search" placeholder="🔍 Søk etter sted eller aktivitet..." oninput="render()">
</div>

<div class="filters" id="catFilters"></div>
<div class="sub-filters" id="areaFilters"></div>
<div class="results-info" id="resultsInfo"></div>

<div class="cards" id="cards"></div>

<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const PLACES = PLACES_DATA;

const CATEGORIES = [
  {id:'all',label:'🗺️ Alle'},
  {id:'badested',label:'🏊 Bading'},
  {id:'badstue',label:'🧖 Badstue'},
  {id:'elvebad',label:'🏞️ Elvebad'},
  {id:'tuftpark',label:'💪 Tuftepark'},
  {id:'tennisbane',label:'🎾 Tennis'},
  {id:'padelbane',label:'🏓 Padel'},
  {id:'fotballbane',label:'⚽ Fotball'},
  {id:'basketballbane',label:'🏀 Basket'},
  {id:'volleyballbane',label:'🏐 Volleyball'},
  {id:'skatepark',label:'🛹 Skate'},
  {id:'klatring',label:'🧗 Klatring'},
  {id:'discgolf',label:'🥏 Discgolf'},
  {id:'løperute',label:'🏃 Løping'},
  {id:'tur',label:'🥾 Tur'},
  {id:'skiløype',label:'⛷️ Ski'},
  {id:'skøytebane',label:'⛸️ Skøyter'},
  {id:'golf',label:'⛳ Golf'},
  {id:'kajakkutleie',label:'🚣 Kajakk'},
  {id:'badminton',label:'🏸 Badminton'},
  {id:'bordtennis',label:'🏓 Bordtennis'},
  {id:'sykling',label:'🚴 Sykling'},
  {id:'yoga',label:'🧘 Yoga'},
  {id:'øy',label:'🏝️ Øyer'},
];

const AREAS = ['Alle områder','Sentrum','Vest','Nord','Sørøst','Øst','Bærum','Asker'];

let activeCat = 'all';
let activeArea = 'Alle områder';
let freeOnly = false;

function buildFilters() {
  const cf = document.getElementById('catFilters');
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (c.id === activeCat ? ' active' : '');
    btn.textContent = c.label;
    btn.onclick = () => { activeCat = c.id; document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); };
    cf.appendChild(btn);
  });

  const af = document.getElementById('areaFilters');
  
  // Free toggle
  const ft = document.createElement('button');
  ft.className = 'sub-btn' + (freeOnly ? ' active' : '');
  ft.textContent = '✅ Gratis';
  ft.onclick = () => { freeOnly = !freeOnly; ft.classList.toggle('active'); render(); };
  af.appendChild(ft);

  AREAS.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'sub-btn' + (a === activeArea ? ' active' : '');
    btn.textContent = a;
    btn.onclick = () => { activeArea = a; document.querySelectorAll('.sub-btn').forEach((b,i)=>{if(i>0)b.classList.remove('active')}); btn.classList.add('active'); render(); };
    af.appendChild(btn);
  });
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  let results = PLACES.filter(p => {
    if (activeCat !== 'all' && !p.activity_types.includes(activeCat)) return false;
    if (activeArea !== 'Alle områder' && p.area !== activeArea) return false;
    if (freeOnly && !p.is_free) return false;
    if (q) {
      const searchable = [p.name, p.description, p.neighborhood, p.municipality, ...(p.best_for_tags||[]), ...(p.activity_types||[])].join(' ').toLowerCase();
      if (!searchable.includes(q)) return false;
    }
    return true;
  });

  // Sort: featured first, then alphabetical
  results.sort((a,b) => (b.featured?1:0)-(a.featured?1:0) || a.name.localeCompare(b.name));

  document.getElementById('resultsInfo').textContent = `${results.length} steder funnet`;

  const container = document.getElementById('cards');
  if (results.length === 0) {
    container.innerHTML = '<div class="no-results"><span>🔍</span>Ingen steder funnet. Prøv et annet søk!</div>';
    return;
  }

  container.innerHTML = results.map(p => {
    const types = p.activity_types.slice(0,3).map(t => `<span class="tag type">${t}</span>`).join('');
    const tags = (p.best_for_tags||[]).slice(0,3).map(t => `<span class="tag">${t}</span>`).join('');
    const icons = [];
    if (p.toilet) icons.push('<span class="icon-info">🚻 WC</span>');
    if (p.parking) icons.push('<span class="icon-info">🅿️ Parkering</span>');
    if (p.public_transport) icons.push('<span class="icon-info">🚌 Kollektiv</span>');
    if (p.dog_friendly) icons.push('<span class="icon-info">🐕 Hundevennlig</span>');
    if (p.kiosk_cafe) icons.push('<span class="icon-info">☕ Kiosk/kafé</span>');
    
    return `<div class="card" onclick="openModal('${p.id}')">
      <div class="card-top">
        <div>
          ${p.featured ? '<span class="featured-badge">⭐ Anbefalt</span><br>' : ''}
          <div class="card-name">${p.name}</div>
          <div class="card-area">📍 ${p.neighborhood || p.municipality} · ${p.area}</div>
        </div>
        <span class="${p.is_free ? 'badge-free' : 'badge-paid'}">${p.is_free ? 'Gratis' : p.price_range || 'Betalt'}</span>
      </div>
      <div class="card-desc">${p.description}</div>
      <div class="card-tags">${types}${tags}</div>
      <div class="card-footer">${icons.join('')}</div>
    </div>`;
  }).join('');
}

function openModal(id) {
  const p = PLACES.find(x => x.id === id);
  if (!p) return;
  const rows = [
    ['Adresse', p.address || '—'],
    ['Bydel/område', `${p.neighborhood || ''} · ${p.municipality}`],
    ['Aktiviteter', p.activity_types.join(', ')],
    ['Pris', p.is_free ? '🆓 Gratis' : (p.price_range || 'Betalt')],
    ['Bestilling', p.booking_required ? '✅ Kreves' : '❌ Ikke nødvendig'],
    ['Kollektivt', p.public_transport ? (p.transport_details || '✅ Ja') : '❌ Nei'],
    ['Parkering', p.parking ? '✅ Ja' : '❌ Nei'],
    ['Toalett', p.toilet ? '✅ Ja' : '❌ Nei'],
    ['Dusj', p.shower ? '✅ Ja' : '—'],
    ['Kiosk/kafé', p.kiosk_cafe ? '✅ Ja' : '—'],
    ['Hundvenlig', p.dog_friendly ? '✅ Ja' : '❌ Nei'],
    ['Familievennlig', p.family_friendly ? '✅ Ja' : '—'],
    ['Rullestol', p.wheelchair_accessible ? '✅ Ja' : '—'],
    ['Sesonger', (p.seasons||[]).join(', ')],
  ].map(([l,v]) => `<div class="modal-row"><span class="m-label">${l}</span><span class="m-val">${v}</span></div>`).join('');

  const tags = [...(p.activity_types||[]), ...(p.best_for_tags||[])].map(t=>`<span class="tag type">${t}</span>`).join('');
  const bookBtn = p.booking_url ? `<a href="${p.booking_url}" target="_blank" class="btn-book">📅 Book plass</a>` : '';

  document.getElementById('modalContent').innerHTML = `
    <span class="close-btn" onclick="document.getElementById('modal').style.display='none'">✕</span>
    <h2>${p.name}</h2>
    <div class="m-area">📍 ${p.address || p.neighborhood || p.municipality}</div>
    <div class="m-desc">${p.description}</div>
    <div class="modal-tags">${tags}</div>
    ${rows}
    ${bookBtn}
  `;
  document.getElementById('modal').style.display = 'block';
}

function closeModal(e) {
  if (e.target.id === 'modal') document.getElementById('modal').style.display = 'none';
}

buildFilters();
render();
</script>
</body>
</html>
